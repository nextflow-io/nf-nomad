name: nf-azure CI
on:
  workflow_dispatch:

jobs:
  build:
    name: Build nf-nomad
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    runs-on: nfazure
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        java_version: [19]

    steps:
      - name: Environment
        run: env | sort

      - name: Checkout
        uses: actions/checkout@50fbc622fc4ef5163becd7fab6573eac35f8462e # ratchet:actions/checkout@v1
        with:
          fetch-depth: 1
          submodules: true

      - name: Setup Java ${{ matrix.java_version }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # ratchet:actions/setup-java@v6.2.0
        with:
          distribution: 'temurin'
          java-version: ${{matrix.java_version}}
          architecture: x64

      - name: Compile
        run: ./gradlew assemble

      - name: Tests
        run: ./gradlew check
        env:
          GRADLE_OPTS: '-Dorg.gradle.daemon=false'

      - name: Install
        run: ./gradlew clean unzipPlugin -x test -P version=nfazure
        env:
          GRADLE_OPTS: '-Dorg.gradle.daemon=false'

      - name: Validate
        run: |
          cd validation
          export NOMAD_PLUGIN_VERSION=nfazure
          ./run-all.sh --skiplocal --nfgithub
